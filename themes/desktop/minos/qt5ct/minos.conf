; minos for Qt 5 and 6: the palette qt5ct and qt6ct give every program, drawn with Qt's Windows style.
; The colours are those of the minos GTK theme (gtk-2.0/gtkrc, gtk-3.0/gtk.css) and i3's greys; Windows
; draws its frames with Light, Midlight, Dark and Shadow, which Fusion would leave black on black.
; Roles in order: WindowText Button Light Midlight Dark Mid Text BrightText ButtonText Base Window Shadow
; Highlight HighlightedText Link LinkVisited AlternateBase NoRole ToolTipBase ToolTipText PlaceholderText
[ColorScheme]
active_colors=#c7c1cc, #222222, #676166, #333333, #333333, #333333, #c7c1cc, #ffffff, #c7c1cc, #000000, #000000, #000000, #575155, #f9f3ff, #2c82dd, #8c4665, #111111, #000000, #000000, #e1e1e1, #676166
disabled_colors=#676166, #222222, #676166, #333333, #333333, #333333, #676166, #ffffff, #676166, #000000, #000000, #000000, #333333, #676166, #2c82dd, #8c4665, #111111, #000000, #000000, #676166, #676166
inactive_colors=#c7c1cc, #222222, #676166, #333333, #333333, #333333, #c7c1cc, #ffffff, #c7c1cc, #000000, #000000, #000000, #575155, #f9f3ff, #2c82dd, #8c4665, #111111, #000000, #000000, #e1e1e1, #676166
